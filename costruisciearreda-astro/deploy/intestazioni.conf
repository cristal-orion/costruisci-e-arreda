# Intestazioni di sicurezza, da includere in **ogni** location che aggiunge
# un'intestazione propria.
#
# Perché ripetute e non scritte una volta nel blocco `server`: in nginx
# `add_header` **non** si somma a quello ereditato — se una location ne dichiara
# uno suo, perde tutti quelli del livello sopra. Una `location` che imposta il
# `Cache-Control` si porterebbe via CSP, nosniff e il resto, in silenzio.
# Quindi: un file, incluso dove serve.
#
# `always` = l'intestazione va messa anche sulle risposte di errore. Senza, una
# 404 uscirebbe senza CSP.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# HSTS **senza** `includeSubDomains` e senza `preload`, di proposito: non
# sappiamo che cosa risponde sui sottodomini di costruisciearreda.it (webmail,
# posta, pannelli del vecchio hosting). Forzare HTTPS su tutto il dominio da un
# file di configurazione di questo sito è un modo di rompere roba di qualcun
# altro. Va allargato quando qualcuno ha verificato i sottodomini, non prima.
# Lo shop è su costruisciearreda.**com**, dominio diverso: non c'entra.
add_header Strict-Transport-Security "max-age=31536000" always;

# La Content-Security-Policy è generata dal build (hash degli script in linea):
# vedi deploy/genera-csp.js.
include /etc/nginx/snippets/csp.conf;
