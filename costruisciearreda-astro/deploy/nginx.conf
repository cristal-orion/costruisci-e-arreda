# Il sito servito da nginx: un blocco `server` per HTML statico.
#
# Finisce in /etc/nginx/conf.d/default.conf, quindi dentro il blocco `http`
# dell'nginx.conf dell'immagine. La mappa dei vecchi URL `?p=ID` sta in un file
# a parte (`redirect-map.conf`) perché una `map` vuole il contesto `http`: in
# conf.d ci finisce da sé, accanto a questo.
#
# TLS non è qui: davanti c'è il proxy di Coolify, che termina HTTPS e inoltra in
# chiaro sulla rete interna. Questo server ascolta su 80 e non redirige verso
# https — quel salto lo fa il proxy. Se un giorno il container venisse esposto
# direttamente, va aggiunto.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # non annunciare la versione di nginx nelle intestazioni e nelle pagine di errore
    server_tokens off;

    # I redirect che nginx genera da sé — quello di `try_files $uri/` quando
    # manca la barra finale, e quelli di `redirect.conf` — sarebbero assoluti, e
    # costruiti su quello che il container vede: `http://` e la porta interna.
    # Dietro il proxy, che termina HTTPS e inoltra in chiaro, significa spedire
    # il browser su http:// e, se la porta finisce nell'indirizzo, su una porta
    # che da fuori non esiste. `off` li rende relativi (`Location: /contatti/`):
    # schema e host li rimette il browser, che sono quelli giusti.
    absolute_redirect off;

    # 128 KB: la pagina più pesante del sito è 42 KB di HTML. Un POST grosso qui
    # non ha destinatari — i form vanno a un servizio esterno.
    client_max_body_size 128k;

    # --- Compressione ------------------------------------------------------
    # `gzip_static` serve i .gz precompressi che il build prepara con `gzip -9`:
    # niente compressione a ogni richiesta, e a livello 9 invece del 5 di default.
    # Il `gzip on` resta come rete di sicurezza per i file senza .gz a fianco.
    #
    # Brotli non c'è: il modulo non è nell'immagine nginx ufficiale e andrebbe
    # compilato. Misurato su questo sito, brotli -q 11 contro gzip -9 fa
    # 8.172 contro 9.366 byte sulla homepage e 8.058 contro 8.957 sul CSS: circa
    # il 13%, cioè **2 KB** sul primo caricamento di una pagina. Non vale una
    # build custom di nginx da mantenere; se un giorno il modulo c'è, i .br si
    # generano nello stesso punto del build dove ora si generano i .gz.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    sendfile on;
    tcp_nopush on;

    # --- Redirect 301 dal vecchio sito -------------------------------------
    # Generati da _migrazione/build-redirect.js dalla sitemap del sito live.
    # Vanno prima di tutto il resto: sono `location =`, quindi hanno comunque la
    # precedenza, ma l'`if` sui vecchi `?p=ID` agisce in fase di rewrite.
    include /etc/nginx/snippets/redirect.conf;

    # --- Asset con hash nel nome -------------------------------------------
    # `_astro/` contiene solo file il cui nome cambia col contenuto
    # (style.CQS4Fd0X.css, DSC03145-scaled.Bg7gj2fx_1abc.webp): si possono
    # tenere in cache per sempre. Sono 2.101 WebP, il 99% del peso del sito.
    # `^~`: questo prefisso batte le location con espressione regolare, che
    # altrimenti avrebbero la precedenza — il font `.woff2` sta qui dentro e
    # finirebbe nella regola dei font, che dice le stesse cose ma da un'altra
    # parte. Una regola sola per la cartella, e si sa dove guardare.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/intestazioni.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Font fuori da _astro ----------------------------------------------
    # Oggi non ce ne sono (Montserrat viene impacchettato con l'hash), ma un
    # font aggiunto a mano in `public/` finirebbe qui invece che senza cache.
    location ~* \.(woff2|woff|ttf)$ {
        include /etc/nginx/snippets/intestazioni.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- File di servizio ---------------------------------------------------
    # Nomi fissi: la cache va tenuta corta, altrimenti una sitemap aggiornata
    # resta invisibile ai motori per un anno.
    location ~* ^/(robots\.txt|sitemap.*\.xml|favicon\.(ico|svg)|apple-touch-icon\.png)$ {
        include /etc/nginx/snippets/intestazioni.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Le pagine ----------------------------------------------------------
    # `must-revalidate` con max-age=0: il browser ricontrolla sempre, ma se
    # l'ETag combacia la risposta è un 304 di poche centinaia di byte. Tenere
    # l'HTML in cache a lungo significa servire un menu vecchio dopo un deploy.
    #
    # Le rotte del sito finiscono tutte con "/" (`trailingSlash: 'always'`), e
    # sono cartelle con dentro index.html.
    location / {
        include /etc/nginx/snippets/intestazioni.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # --- 404 ----------------------------------------------------------------
    # Pagina del sito, non la schermata di nginx: header, footer, e i link ai
    # quattro rami. Lo stato resta 404.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/intestazioni.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        internal;
    }

    # Gli errori 5xx qui non hanno una pagina propria: non c'è applicazione che
    # possa fallire, solo file su disco. Se compaiono, è nginx o il disco.
}
