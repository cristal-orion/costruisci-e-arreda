# GENERATO da _migrazione/build-redirect.js — non modificare a mano.
#
# Redirect 301 per il cutover. Le destinazioni vengono dalla sitemap del sito
# live (i 56 URL indicizzati) confrontata con le rotte che il rebuild produce.
# Da includere nel blocco `server` di nginx.

# --- URL che il rebuild non serve più ---
# archivio autore di WordPress con un solo autore ("admin"): non è contenuto
location = /author/admin/ { return 301 /category/ultime-news-e-articoli/; }

# landing con offerta scaduta (€ 166 al mese, valida fino al 31 Dicembre), ritirata su decisione del proprietario il 2026-09-02. Chi arriva da un vecchio link cerca un preventivo
location = /promo-casa/ { return 301 /richiedi-preventivo/; }

# root di archivio del CPT, thin. La pagina vera delle realizzazioni è quella
location = /realizzazioni/ { return 301 /i-nostri-lavori/; }

# duplicato di /richiedi-preventivo/ senza form: 226 parole di solo carosello news. Contenuto duplicato indicizzato
location = /richiedi-preventivo-2/ { return 301 /richiedi-preventivo/; }

# root di archivio del CPT, pagina thin con 2 <h1> e titolo "Archivi: …". La pagina vera dei servizi è quella
location = /services/ { return 301 /dalla-progettazione-alla-realizzazione/; }

# root di archivio del CPT, thin. L'elenco vero dei punti vendita è l'archivio showroom
location = /store/ { return 301 /type_stores/showroom-cat/; }

# thank-you della landing /promo-casa/: senza la landing non ha più senso
location = /thankyou-promo-6500/ { return 301 /richiedi-preventivo/; }

# --- Vecchi URL nella forma /?p=ID (WordPress) ---
